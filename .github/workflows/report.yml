name: Report pipeline results
on:
  workflow_run:
    workflows: [DeployLens CI/CD]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run ID to import
        required: true
permissions:
  contents: read
  actions: read
jobs:
  report:
    if: >-
      vars.DEPLOYLENS_URL != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'))
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Trusted default-branch code only. Never execute artifacts or code from the source run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - run: python scripts/smoke.py
        env:
          SMOKE_URL: ${{ vars.DEPLOYLENS_URL }}
      - run: python scripts/report_pipeline.py
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          DEPLOYLENS_URL: ${{ vars.DEPLOYLENS_URL }}
          DEPLOYLENS_ADMIN_TOKEN: ${{ secrets.DEPLOYLENS_ADMIN_TOKEN }}
