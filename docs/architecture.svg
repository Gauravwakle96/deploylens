<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc"><title id="title">DeployLens architecture</title><desc id="desc">GitHub Actions builds and tests the application and Docker image, deploys the validated commit to Render and verifies the release. DeployLens uses Supabase PostgreSQL, receives pipeline reports, probes Feedback Board and exports logs and metrics. An independent hourly workflow probes DeployLens.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#56776b"/></marker></defs><rect width="1440" height="990" fill="#f4f7f5"/><g font-family="Segoe UI,Arial,sans-serif"><text x="55" y="62" font-size="32" font-weight="700" fill="#173e32">DeployLens</text><text x="55" y="94" font-size="17" fill="#53665d">Final project architecture · Gaurav Wakle</text><text x="55" y="141" font-size="12" font-weight="700" fill="#53665d" letter-spacing="2">AUTOMATED DELIVERY</text><rect x="55" y="160" width="230" height="110" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="73" y="191" font-size="17" font-weight="650" fill="#204a3b">1. GitHub</text><text x="73" y="218" font-size="13" fill="#52665a">Push / pull request</text><text x="73" y="241" font-size="13" fill="#52665a">Version-controlled source</text><rect x="330" y="160" width="230" height="110" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="348" y="191" font-size="17" font-weight="650" fill="#204a3b">2. Build &amp; test</text><text x="348" y="218" font-size="13" fill="#52665a">React build + Python checks</text><text x="348" y="241" font-size="13" fill="#52665a">24 tests + dependency audits</text><rect x="605" y="160" width="230" height="110" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="623" y="191" font-size="17" font-weight="650" fill="#204a3b">3. Docker</text><text x="623" y="218" font-size="13" fill="#52665a">Multi-stage image build</text><text x="623" y="241" font-size="13" fill="#52665a">Run container smoke tests</text><rect x="880" y="160" width="230" height="110" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="898" y="191" font-size="17" font-weight="650" fill="#204a3b">4. Deploy</text><text x="898" y="218" font-size="13" fill="#52665a">Main branch + secrets</text><text x="898" y="241" font-size="13" fill="#52665a">Render builds validated commit</text><rect x="1155" y="160" width="230" height="110" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="1173" y="191" font-size="17" font-weight="650" fill="#204a3b">5. Verify</text><text x="1173" y="218" font-size="13" fill="#52665a">Check live version + health</text><text x="1173" y="241" font-size="13" fill="#52665a">Record successful release</text><path d="M285 215 H324" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M560 215 H599" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M835 215 H874" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1110 215 H1149" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="55" y="331" font-size="12" font-weight="700" fill="#53665d" letter-spacing="2">CLOUD APPLICATION &amp; OBSERVABILITY</text><rect x="55" y="365" width="295" height="120" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="73" y="396" font-size="17" font-weight="650" fill="#204a3b">Browser</text><text x="73" y="423" font-size="13" fill="#52665a">Public React + TypeScript dashboard</text><text x="73" y="446" font-size="13" fill="#52665a">Release history, pipelines, incidents</text><text x="73" y="469" font-size="13" fill="#52665a">Read-only access over HTTPS</text><rect x="430" y="365" width="490" height="150" rx="10" fill="#e7f1eb" stroke="#bdcec4"/><text x="448" y="396" font-size="17" font-weight="650" fill="#204a3b">Render Free · Docker web service</text><text x="448" y="423" font-size="13" fill="#52665a">FastAPI serves compiled React assets</text><text x="448" y="446" font-size="13" fill="#52665a">Single non-root worker + background health collector</text><text x="448" y="469" font-size="13" fill="#52665a">Request IDs, timing and structured stdout logs</text><text x="448" y="492" font-size="13" fill="#52665a">Release/report callbacks require a bearer token</text><rect x="1040" y="365" width="345" height="150" rx="10" fill="#edf2fa" stroke="#bdcec4"/><text x="1058" y="396" font-size="17" font-weight="650" fill="#204a3b">Supabase · Managed PostgreSQL</text><text x="1058" y="423" font-size="13" fill="#52665a">Dedicated deploylens schema</text><text x="1058" y="446" font-size="13" fill="#52665a">Restricted application role + TLS</text><text x="1058" y="469" font-size="13" fill="#52665a">Releases, pipeline results, health checks</text><text x="1058" y="492" font-size="13" fill="#52665a">and incident history</text><path d="M350 425 H420" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M920 425 H1030" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="937" y="413" font-size="12" fill="#52665a">TLS</text><path d="M1270 270 V308 H675 V355" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="693" y="301" font-size="12" fill="#52665a">Verify deployment and save release</text><rect x="55" y="590" width="295" height="133" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="73" y="621" font-size="17" font-weight="650" fill="#204a3b">Pipeline reports</text><text x="73" y="648" font-size="13" fill="#52665a">GitHub workflow completion</text><text x="73" y="671" font-size="13" fill="#52665a">Temporary Actions token reads jobs</text><text x="73" y="694" font-size="13" fill="#52665a">Authenticated report to DeployLens</text><text x="73" y="717" font-size="13" fill="#52665a">Saved results include failures</text><rect x="405" y="590" width="295" height="133" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="423" y="621" font-size="17" font-weight="650" fill="#204a3b">External monitor</text><text x="423" y="648" font-size="13" fill="#52665a">Independent GitHub workflow</text><text x="423" y="671" font-size="13" fill="#52665a">Hourly probe of DeployLens</text><text x="423" y="694" font-size="13" fill="#52665a">Website + API + database + metrics</text><text x="423" y="717" font-size="13" fill="#52665a">Failure visible in GitHub Actions</text><rect x="750" y="590" width="295" height="133" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="768" y="621" font-size="17" font-weight="650" fill="#204a3b">Feedback Board</text><text x="768" y="648" font-size="13" fill="#52665a">Operator-configured health target</text><text x="768" y="671" font-size="13" fill="#52665a">Probe every 60s while awake</text><text x="768" y="694" font-size="13" fill="#52665a">Failure opens incident</text><text x="768" y="717" font-size="13" fill="#52665a">Recovery resolves incident</text><rect x="1090" y="590" width="295" height="133" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="1108" y="621" font-size="17" font-weight="650" fill="#204a3b">Logs &amp; metrics</text><text x="1108" y="648" font-size="13" fill="#52665a">JSON stdout in Render logs</text><text x="1108" y="671" font-size="13" fill="#52665a">Public sanitized request log view</text><text x="1108" y="694" font-size="13" fill="#52665a">Prometheus-format /metrics</text><text x="1108" y="717" font-size="13" fill="#52665a">Counters reset on restart</text><path d="M203 590 V546 H490 V525" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M553 590 V525" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M815 515 V562 H895 V580" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M875 515 V535 H1238 V580" stroke="#56776b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="55" y="781" font-size="12" font-weight="700" fill="#53665d" letter-spacing="2">ENVIRONMENTS</text><rect x="55" y="800" width="420" height="90" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="73" y="831" font-size="17" font-weight="650" fill="#204a3b">Local development</text><text x="73" y="858" font-size="13" fill="#52665a">Docker Compose: app + migration + PostgreSQL</text><text x="73" y="881" font-size="13" fill="#52665a">Private database network and persistent volume</text><rect x="505" y="800" width="420" height="90" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="523" y="831" font-size="17" font-weight="650" fill="#204a3b">GitHub CI</text><text x="523" y="858" font-size="13" fill="#52665a">Disposable PostgreSQL test database</text><text x="523" y="881" font-size="13" fill="#52665a">Pull requests have no deployment credentials</text><rect x="955" y="800" width="430" height="90" rx="10" fill="#ffffff" stroke="#bdcec4"/><text x="973" y="831" font-size="17" font-weight="650" fill="#204a3b">Production</text><text x="973" y="858" font-size="13" fill="#52665a">Render environment + encrypted GitHub secrets</text><text x="973" y="881" font-size="13" fill="#52665a">Cloud data stored in managed Supabase PostgreSQL</text><text x="55" y="934" font-size="13" fill="#52665a">Free hosting can sleep. Internal probes pause while asleep; scheduled workflows can be delayed.</text><text x="55" y="959" font-size="13" fill="#52665a">Managed database integration is implemented. End-user authentication is not required for this public read-only dashboard.</text></g></svg>